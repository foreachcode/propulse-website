<header class="header{% if page.header_scrolled %} scrolled{% endif %}" id="header">
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo">
        <img src="/assets/logos/logo-propulse-white.svg" alt="Propulse" loading="eager" />
      </a>

      <div class="nav-links">
        {% for link in site.data.navigation.main %}
        <a href="{{ link.url }}">{{ link.label }}</a>
        {% endfor %}
      </div>

      <div class="nav-cta">
        {% for cta in site.data.navigation.cta %}
        <a href="{{ cta.url }}" class="{{ cta.class }}">{{ cta.label }}</a>
        {% endfor %}
      </div>

      <button class="nav-mobile-toggle" id="mobile-toggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu">
  {% for link in site.data.navigation.main %}
  <a href="{{ link.url }}">{{ link.label }}</a>
  {% endfor %}
  {% for cta in site.data.navigation.cta %}
  <a href="{{ cta.url }}" class="{{ cta.class }}">{{ cta.label }}</a>
  {% endfor %}
</div>
