- question: "Quel est le tarif de Propulse ?"
  answer: "Propulse est proposé à 49€ HT/mois avec toutes les fonctionnalités incluses et sans frais de mise en service. Un tarif unique et transparent pour gérer l'ensemble de votre réseau d'affaires."

- question: "Quelles fonctionnalités sont incluses ?"
  answer: "Toutes les fonctionnalités sont incluses dans l'abonnement : fiches membres, organisation des réunions, suivi du chiffre d'affaires, gestion des adhésions, trombinoscope, comptes rendus et organisation d'événements."

- question: "Comment mesurer la performance de mon club ?"
  answer: "Grâce à notre système de comptabilisation du chiffre d'affaires réalisé entre les membres, vous pouvez suivre précisément les échanges commerciaux et évaluer l'impact de votre réseau."

- question: "Puis-je tester Propulse avant de m'engager ?"
  answer: "Oui, nous proposons une démonstration gratuite pour vous présenter toutes les fonctionnalités de la plateforme. Réservez un créneau via notre page de contact."
