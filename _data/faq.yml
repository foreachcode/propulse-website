- question: Quelles sont les fonctionnalités gratuites ?
  answer: La plupart des fonctionnalités de base, telles que l'organisation des réunions, la rédaction des comptes rendus et la consultation du trombinoscope sont entièrement gratuites.

- question: Quelles sont les fonctionnalités payantes ?
  answer: Certaines options avancées comme la gestion des adhésions et le suivi du chiffre d'affaires nécessitent un abonnement premium pour débloquer tout leur potentiel.

- question: Comment mesurer la performance de mon club ?
  answer: Grâce à notre système de comptabilisation du chiffre d'affaires réalisé entre les membres, vous pouvez suivre précisément les échanges commerciaux et évaluer l'impact de votre réseau.
